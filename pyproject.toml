[project]
name = "basis"
version = "0.1.0"
description = "Event-driven crypto basis trading engine (Kalshi perps vs. Robinhood spot)"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "websockets>=15",
    "cryptography>=44",
    "polars>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "hypothesis>=6",
    "ruff>=0.12",
    "mypy>=1.17",
]

[project.scripts]
basis-record = "basis.data.recorder:main"
basis-backfill = "basis.data.backfill:main"
basis-check = "basis.ops.check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["network: hits real public endpoints (deselect with -m 'not network')"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
packages = ["basis"]
