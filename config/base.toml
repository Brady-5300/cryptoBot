# Non-secret configuration. Secrets come from the environment / secrets.env (see secrets.example.env).

[paths]
# Override with CRYPTOBOT_DATA_DIR. Keep this OUTSIDE OneDrive: sync fights constant appends.
data_dir = "C:/cryptobot-data"

[kalshi]
env = "prod"                       # "prod" | "demo"; market data is recorded from prod (demo prices are unrealistic)
tickers = ["KXBTCPERP", "KXETHPERP", "KXSOLPERP", "KXXRPPERP"]
ws_channels = ["ticker", "trade", "orderbook_delta"]
# Public REST polling of /margin/markets (no keys needed). Runs alongside WS as a cross-check,
# and is the only Kalshi source when no API key is configured.
markets_poll_s = 1.0
funding_estimate_poll_s = 30.0
orderbook_poll_s = 0.0             # 0 = off; REST book snapshots (public). WS book is preferred.

[robinhood]
symbols = ["BTC-USD", "ETH-USD", "SOL-USD", "XRP-USD"]
# Account-wide limit is 100 req/min (burst 300) and is SHARED with any trading process.
# The recorder caps itself well below that.
max_requests_per_min = 60
best_bid_ask_poll_s = 3.0          # per API version (v1 and v2 are both polled)
api_versions = ["v1", "v2"]
# Size-aware cost curve. Quantities are in asset units, per symbol (max 10 per request).
estimated_price_poll_s = 30.0
[robinhood.estimated_price_quantities]
"BTC-USD" = ["0.0005", "0.005", "0.05"]

[recorder]
rotate = "hour"                    # one raw file per stream per UTC hour
stats_log_s = 60.0
# Warn (and alert if NTFY_TOPIC set) when a stream has been silent this long.
stale_after_s = 120.0
heartbeat_file = "recorder.heartbeat"
